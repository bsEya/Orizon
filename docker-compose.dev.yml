services:
  db:
    ports:
      - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: orizon-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@orizon.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db

  keycloak:
    command: start-dev          # dev mode: no HTTPS required, faster iteration
    ports:
      - "8081:8080"

  keycloak-config-cli:
    volumes:
      - ./keycloak/config/dev:/config