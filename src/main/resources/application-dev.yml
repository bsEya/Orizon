# ===============================
# CONFIGURATION DE DÉVELOPPEMENT
# ===============================

server:
  port: 8080

# Base de données PostgreSQL
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orizon_core
    username: orizon_user
    password: orizon_password
    driver-class-name: org.postgresql.Driver

  # Docker Compose
  docker:
    compose:
      enabled: false
      lifecycle-management: start-and-stop
      skip:
        in-tests: false

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Paramètres d'audit & JSON
  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

  # Keycloak / OAuth2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/orizon
          jwk-set-uri: http://localhost:8081/realms/orizon/protocol/openid-connect/certs

# Logging
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE

# JWT Converter
jwt:
  auth:
    converter:
      resource-id: orizon
      principle-attribute: preferred_username