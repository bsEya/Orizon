# ===============================
# CONFIGURATION DE PRODUCTION
# ===============================
server.port=8080

# Base de données (à remplir avec les vraies informations de production)
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USER}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging (moins verbeux en production)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.amaris.orizon=INFO

# Paramètres JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
