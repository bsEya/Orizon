# ===============================
# CONFIGURATION DE DÉVELOPPEMENT
# ===============================
server.port=8080

# Base de données (PostgreSQL sur port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5432/orizon_core
spring.datasource.username=orizon_user
spring.datasource.password=orizon_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Docker Compose
spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.skip.in-tests=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=trace

# Paramètres d'audit & JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# Keycloak / OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/orizon
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/orizon/protocol/openid-connect/certs

# JWT Converter
jwt.auth.converter.resource-id=orizon
jwt.auth.converter.principle-attribute=preferred_username
